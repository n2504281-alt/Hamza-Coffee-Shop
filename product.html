<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Customizer — Hamza Coffee Shop</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo"><div class="logo-icon"><i data-lucide="coffee"></i></div><span>Hamza</span> Coffee</a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link active">Menu</a>
        <a href="story.html" class="nav-link">Our Story</a>
        <a href="gallery.html" class="nav-link">Gallery</a>
        <a href="locations.html" class="nav-link">Locations</a>
        <a href="offers.html" class="nav-link">Offers</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn open-cart-btn"><i data-lucide="shopping-bag"></i><span class="icon-badge cart-count-badge" style="display:none;">0</span></button>
        <a href="order.html" class="btn btn-primary btn-sm">Order Ahead</a>
      </div>
    </div>
  </header>

  <main style="padding-top:7rem;" class="section">
    <div class="container">
      <div id="productDetailContainer" class="grid grid-2" style="gap:4rem; align-items:start;">
        <!-- Populated via JS -->
      </div>
    </div>
  </main>

  <!-- Side Cart Drawer -->
  <div id="cartOverlay" class="cart-overlay"></div>
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header"><h3>Your Coffee Cart</h3><button id="closeCartBtn" class="icon-btn"><i data-lucide="x"></i></button></div>
    <div id="cartDrawerItems" class="cart-drawer-items"></div>
    <div class="cart-drawer-footer">
      <div style="display:flex; justify-content:space-between; margin-bottom:1rem; font-weight:700;"><span>Total:</span><span id="cartDrawerTotal" style="color:var(--color-caramel);">$0.00</span></div>
      <a href="checkout.html" class="btn btn-primary" style="width:100%;">Proceed to Checkout</a>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    let currentProd = null;
    let selectedSize = 'Medium';
    let selectedMilk = 'Whole Milk';
    let selectedTemp = 'Hot';
    let selectedExtras = [];
    let quantity = 1;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id') || 'prod-1';
      currentProd = PRODUCTS_DATA.find(p => p.id === prodId) || PRODUCTS_DATA[0];

      selectedSize = currentProd.sizes ? currentProd.sizes[0] : 'Standard';
      selectedMilk = currentProd.milkOptions ? currentProd.milkOptions[0] : 'None';

      renderProductDetails();
    });

    function renderProductDetails() {
      const container = document.getElementById('productDetailContainer');
      if (!container) return;

      container.innerHTML = `
        <div style="position:relative; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--color-border-dark); box-shadow:var(--shadow-lg);">
          <img src="${currentProd.image}" alt="${currentProd.name}" style="width:100%; height:480px; object-fit:cover;">
          ${currentProd.badge ? `<span class="badge badge-gold" style="position:absolute; top:20px; left:20px;">${currentProd.badge}</span>` : ''}
        </div>

        <div>
          <a href="menu.html" style="font-size:0.85rem; color:var(--color-caramel); display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:1rem;"><i data-lucide="arrow-left" style="width:14px;"></i> Back to Menu</a>
          <h1 class="title-md" style="margin-bottom:0.5rem;">${currentProd.name}</h1>
          <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem;">
            <span id="dynamicPriceTag" style="font-family:var(--font-accent); font-size:1.8rem; font-weight:700; color:var(--color-caramel);">$${calculateCurrentPrice().toFixed(2)}</span>
            <div class="rating-badge" style="font-size:0.95rem;"><i data-lucide="star" style="fill:var(--color-gold); width:16px; height:16px;"></i> ${currentProd.rating} (${currentProd.reviewsCount} reviews)</div>
          </div>
          <p style="color:var(--color-text-dim); margin-bottom:2rem;">${currentProd.description}</p>

          <!-- Customization Form -->
          <div style="display:flex; flex-direction:column; gap:1.5rem; background:var(--color-surface-card); padding:1.5rem; border-radius:var(--radius-md); border:1px solid var(--color-border-dark);">
            
            ${currentProd.sizes && currentProd.sizes.length > 1 ? `
              <div>
                <label style="font-weight:600; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Select Size:</label>
                <div style="display:flex; gap:0.75rem;">
                  ${currentProd.sizes.map(s => `
                    <button class="filter-btn ${selectedSize === s ? 'active' : ''}" onclick="selectSize('${s}', this)">${s}</button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            ${currentProd.hotOrIced === 'both' ? `
              <div>
                <label style="font-weight:600; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Temperature:</label>
                <div style="display:flex; gap:0.75rem;">
                  <button class="filter-btn ${selectedTemp === 'Hot' ? 'active' : ''}" onclick="selectTemp('Hot', this)">Hot ☕</button>
                  <button class="filter-btn ${selectedTemp === 'Iced' ? 'active' : ''}" onclick="selectTemp('Iced', this)">Iced 🧊</button>
                </div>
              </div>
            ` : ''}

            ${currentProd.milkOptions && currentProd.milkOptions.length > 0 ? `
              <div>
                <label style="font-weight:600; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Choice of Milk:</label>
                <select onchange="selectedMilk=this.value; updatePriceDisplay();" style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);">
                  ${currentProd.milkOptions.map(m => `<option value="${m}" ${selectedMilk===m?'selected':''}>${m}</option>`).join('')}
                </select>
              </div>
            ` : ''}

            ${currentProd.extras && currentProd.extras.length > 0 ? `
              <div>
                <label style="font-weight:600; font-size:0.9rem; margin-bottom:0.5rem; display:block;">Add Extras:</label>
                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                  ${currentProd.extras.map(ex => `
                    <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem; cursor:pointer;">
                      <input type="checkbox" onchange="toggleExtra('${ex.name}', ${ex.price}, this.checked)" style="accent-color:var(--color-caramel);">
                      <span>${ex.name} (+$${ex.price.toFixed(2)})</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Quantity & Add to Cart -->
            <div style="display:flex; align-items:center; gap:1.5rem; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--color-border-dark);">
              <div class="qty-control" style="background:rgba(255,255,255,0.06); padding:0.4rem 0.8rem; border-radius:var(--radius-full);">
                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                <span id="qtyVal" style="font-weight:700; width:24px; text-align:center;">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
              </div>

              <button class="btn btn-primary" style="flex:1;" onclick="handleAddToCart()">
                <i data-lucide="shopping-bag"></i> Add to Cart
              </button>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function selectSize(s, btn) {
      selectedSize = s;
      btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updatePriceDisplay();
    }

    function selectTemp(t, btn) {
      selectedTemp = t;
      btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updatePriceDisplay();
    }

    function toggleExtra(name, price, isChecked) {
      if (isChecked) {
        selectedExtras.push({ name, price });
      } else {
        selectedExtras = selectedExtras.filter(e => e.name !== name);
      }
      updatePriceDisplay();
    }

    function changeQty(delta) {
      quantity = Math.max(1, quantity + delta);
      document.getElementById('qtyVal').textContent = quantity;
      updatePriceDisplay();
    }

    function calculateCurrentPrice() {
      let base = currentProd.price;
      if (selectedSize === 'Large') base += 0.80;
      if (selectedSize === 'Medium') base += 0.40;
      const extrasSum = selectedExtras.reduce((s, e) => s + e.price, 0);
      return (base + extrasSum) * quantity;
    }

    function updatePriceDisplay() {
      const tag = document.getElementById('dynamicPriceTag');
      if (tag) tag.textContent = `$${calculateCurrentPrice().toFixed(2)}`;
    }

    function handleAddToCart() {
      AppState.addToCart(currentProd, {
        size: selectedSize,
        milk: selectedMilk,
        temp: selectedTemp,
        extras: selectedExtras,
        quantity: quantity
      });
    }
  </script>
</body>
</html>
