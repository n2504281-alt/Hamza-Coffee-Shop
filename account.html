<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account &amp; Order History — Hamza Coffee Shop</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .account-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-card);
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 2rem;
    }
    .order-status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(184, 104, 27, 0.15); color: var(--caramel-accent); }
    .status-completed { background: rgba(46, 125, 50, 0.15); color: #2E7D32; }
  </style>
</head>
<body>

  <!-- HEADER NAVBAR -->
  <header class="navbar-ref">
    <div class="container nav-flex">
      <a href="index.html" class="logo-ref">
        <i data-lucide="coffee" style="color:var(--caramel-accent);"></i>
        <span>Coffee</span>
      </a>
      <nav class="nav-links-ref">
        <a href="index.html" class="nav-link-ref">Home</a>
        <a href="menu.html" class="nav-link-ref">Menu</a>
        <a href="reservations.html" class="nav-link-ref">Book a Table</a>
      </nav>
      <div class="nav-right-actions">
        <button onclick="window.signOutUser()" class="btn-dark" style="padding:0.5rem 1.2rem; font-size:0.82rem;">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:3rem; padding-bottom:5rem;">
    <!-- Customer Profile Summary -->
    <div class="account-card reveal" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1.5rem; background:linear-gradient(135deg, #25140B 0%, #1A0E07 100%); color:#FFF;">
      <div style="display:flex; align-items:center; gap:1.25rem;">
        <div style="width:64px; height:64px; border-radius:50%; background:var(--caramel-accent); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800; color:#FFF;" id="userInitials">
          HC
        </div>
        <div>
          <h1 style="font-family:var(--font-heading); font-size:1.5rem; font-weight:800;" id="userName">Customer Name</h1>
          <p style="font-size:0.88rem; color:rgba(255,255,255,0.75);" id="userEmail">user@example.com</p>
          <span style="display:inline-block; margin-top:0.4rem; background:rgba(255,255,255,0.15); color:var(--caramel-accent); padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:800;">☕ Coffee Club VIP Member</span>
        </div>
      </div>
      <div>
        <a href="menu.html" class="btn-brown" style="padding:0.7rem 1.4rem;">+ Order Fresh Coffee</a>
      </div>
    </div>

    <!-- Active Orders & History -->
    <div class="account-card reveal">
      <h2 style="font-family:var(--font-heading); font-size:1.3rem; margin-bottom:1.5rem; color:var(--dark-espresso); display:flex; align-items:center; gap:0.5rem;">
        <i data-lucide="shopping-bag" style="color:var(--caramel-accent);"></i> My Order History &amp; Live Tracking
      </h2>
      <div id="userOrdersList">
        <p style="color:var(--text-muted);">Loading your order history...</p>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      const user = window.getCurrentUser ? window.getCurrentUser() : null;
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('userName').textContent = user.name || 'Coffee Enthusiast';
      document.getElementById('userEmail').textContent = user.email || '';
      document.getElementById('userInitials').textContent = (user.name || user.email || 'HC').slice(0, 2).toUpperCase();

      loadCustomerOrders(user.email);
    });

    async function loadCustomerOrders(email) {
      const container = document.getElementById('userOrdersList');
      let orders = [];

      if (window.fetchUserOrders) {
        orders = await window.fetchUserOrders(email);
      }

      // Check local active order fallback
      const activeLocal = localStorage.getItem('hcs_active_order');
      if (activeLocal) {
        try {
          const parsed = JSON.parse(activeLocal);
          if (!orders) orders = [];
          if (!orders.some(o => o.order_number === parsed.orderNumber)) {
            orders.unshift({
              order_number: parsed.orderNumber,
              total_amount: parsed.total,
              status: parsed.status || 'Pending',
              created_at: new Date().toISOString(),
              items: parsed.items
            });
          }
        } catch(e){}
      }

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:3rem 1rem; color:var(--text-muted);">
            <i data-lucide="coffee" style="width:48px; height:48px; opacity:0.3; margin-bottom:0.75rem;"></i>
            <p>You haven't placed any orders yet.</p>
            <a href="menu.html" class="btn-brown" style="margin-top:1rem; display:inline-block;">Explore Menu</a>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = orders.map(ord => `
        <div style="border:1px solid var(--border-light); border-radius:12px; padding:1.25rem; margin-bottom:1rem; background:var(--bg-cream-light);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.75rem;">
            <div>
              <strong style="font-size:1.1rem; color:var(--dark-espresso);">${ord.order_number}</strong>
              <span style="font-size:0.8rem; color:var(--text-muted); margin-left:0.5rem;">${new Date(ord.created_at || Date.now()).toLocaleDateString()}</span>
            </div>
            <span class="order-status-badge ${ord.status === 'Completed' ? 'status-completed' : 'status-pending'}">
              ${ord.status || 'Pending'}
            </span>
          </div>
          <div style="font-size:0.88rem; color:var(--text-dark); margin-bottom:0.75rem;">
            Total Amount: <strong style="color:var(--caramel-accent);">$${parseFloat(ord.total_amount || 0).toFixed(2)}</strong>
          </div>
          <div style="font-size:0.82rem; color:var(--text-muted);">
            Items: ${Array.isArray(ord.items) ? ord.items.map(i => `${i.quantity}x ${i.name}`).join(', ') : 'Coffee & Treats'}
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }
  </script>
</body>
</html>
