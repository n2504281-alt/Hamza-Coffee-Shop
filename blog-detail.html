<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Reader — Hamza Coffee Shop</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo"><div class="logo-icon"><i data-lucide="coffee"></i></div><span>Hamza</span> Coffee</a>
      <nav class="nav-links"><a href="blog.html" class="nav-link"><i data-lucide="arrow-left" style="width:14px;"></i> Back to Blog Journal</a></nav>
    </div>
  </header>

  <main style="padding-top:7rem;" class="section">
    <div class="container" style="max-width:800px;">
      <div id="blogDetailContainer"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border:none; padding:0;"><p>© 2026 Hamza Coffee Shop. All rights reserved.</p></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const urlParams = new URLSearchParams(window.location.search);
      const blogId = urlParams.get('id') || 'blog-1';
      const post = BLOG_DATA.find(b => b.id === blogId) || BLOG_DATA[0];

      const container = document.getElementById('blogDetailContainer');
      container.innerHTML = `
        <span class="badge badge-gold" style="margin-bottom:1rem;">${post.category}</span>
        <h1 class="title-lg" style="margin-bottom:1rem;">${post.title}</h1>
        <div style="display:flex; gap:1.5rem; color:var(--color-text-dim); font-size:0.85rem; margin-bottom:2rem;">
          <span>By ${post.author}</span>
          <span>•</span>
          <span>${post.date}</span>
        </div>
        <img src="${post.image}" alt="${post.title}" style="width:100%; height:400px; object-fit:cover; border-radius:var(--radius-lg); margin-bottom:2.5rem; box-shadow:var(--shadow-lg);">
        <div style="font-size:1.1rem; line-height:1.8; color:var(--color-text-light);">
          ${post.content}
        </div>
      `;
      lucide.createIcons();
    });
  </script>
</body>
</html>
