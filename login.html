<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account Login & Sign Up — Hamza Coffee Shop</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-container {
      max-width: 480px;
      margin: 4rem auto;
      background: linear-gradient(145deg, #25140B 0%, #170C06 100%);
      border: 1px solid rgba(184, 104, 27, 0.35);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      color: #FFFFFF;
    }
    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      text-align: center;
    }
    .auth-tab.active {
      color: #FFFFFF;
      border-bottom-color: var(--caramel-accent);
    }
    .auth-field {
      margin-bottom: 1.25rem;
    }
    .auth-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 0.4rem;
    }
    .auth-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }
    .auth-input:focus {
      border-color: var(--caramel-accent);
      background: rgba(255, 255, 255, 0.14);
    }
    .auth-btn {
      width: 100%;
      padding: 0.9rem;
      margin-top: 1rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
    }
  </style>
</head>
<body>

  <!-- HEADER NAVBAR -->
  <header class="navbar-ref">
    <div class="container nav-flex">
      <a href="index.html" class="logo-ref">
        <i data-lucide="coffee" style="color:var(--caramel-accent);"></i>
        <span>Coffee</span>
      </a>
      <nav class="nav-links-ref">
        <a href="index.html" class="nav-link-ref">Home</a>
        <a href="menu.html" class="nav-link-ref">Menu</a>
        <a href="reservations.html" class="nav-link-ref">Book a Table</a>
      </nav>
      <div class="nav-right-actions">
        <a href="index.html" class="nav-link-ref"><i data-lucide="arrow-left" style="width:14px;"></i> Back to Home</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-container reveal">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div style="width:54px; height:54px; border-radius:50%; background:rgba(184,104,27,0.2); color:var(--caramel-accent); display:flex; align-items:center; justify-content:center; margin:0 auto 0.75rem auto;">
          <i data-lucide="user" style="width:28px; height:28px;"></i>
        </div>
        <h1 style="font-family:var(--font-heading); font-size:1.6rem; font-weight:800; color:#FFF;">Customer Account</h1>
        <p style="font-size:0.85rem; color:rgba(255,255,255,0.65);">Sign in to track orders, manage reservations &amp; earn rewards.</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignIn" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="tabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="auth-field">
          <label class="auth-label">Email Address</label>
          <input type="email" id="loginEmail" placeholder="yourname@example.com" required class="auth-input">
        </div>
        <div class="auth-field">
          <label class="auth-label">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required class="auth-input">
        </div>
        <button type="submit" class="btn-brown auth-btn" id="loginSubmitBtn">Sign In to Account →</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signupForm" onsubmit="handleSignupSubmit(event)" style="display:none;">
        <div class="auth-field">
          <label class="auth-label">Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe" required class="auth-input">
        </div>
        <div class="auth-field">
          <label class="auth-label">Email Address</label>
          <input type="email" id="signupEmail" placeholder="yourname@example.com" required class="auth-input">
        </div>
        <div class="auth-field">
          <label class="auth-label">Phone Number</label>
          <input type="tel" id="signupPhone" placeholder="+1 (555) 000-0000" class="auth-input">
        </div>
        <div class="auth-field">
          <label class="auth-label">Password</label>
          <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required minlength="6" class="auth-input">
        </div>
        <button type="submit" class="btn-brown auth-btn" id="signupSubmitBtn">Create Account →</button>
      </form>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const user = window.getCurrentUser ? window.getCurrentUser() : null;
      if (user) {
        window.location.href = 'account.html';
      }
    });

    function switchAuthTab(mode) {
      document.getElementById('tabSignIn').classList.toggle('active', mode === 'login');
      document.getElementById('tabSignUp').classList.toggle('active', mode === 'signup');
      document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = mode === 'signup' ? 'block' : 'none';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const res = await window.signInUser(email, password);
      if (res && res.success) {
        showToast('Successfully logged in!');
        setTimeout(() => window.location.href = 'account.html', 800);
      } else {
        showToast(res ? res.error : 'Login failed. Please check credentials.', 'info');
        btn.disabled = false;
        btn.textContent = 'Sign In to Account →';
      }
    }

    async function handleSignupSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const password = document.getElementById('signupPassword').value;
      const btn = document.getElementById('signupSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const res = await window.signUpUser(email, password, name, phone);
      if (res && res.success) {
        showToast('Account created successfully!');
        setTimeout(() => window.location.href = 'account.html', 800);
      } else {
        showToast(res ? res.error : 'Signup failed. Try again.', 'info');
        btn.disabled = false;
        btn.textContent = 'Create Account →';
      }
    }
  </script>
</body>
</html>
