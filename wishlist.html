<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — Hamza Coffee Shop</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo"><div class="logo-icon"><i data-lucide="coffee"></i></div><span>Hamza</span> Coffee</a>
      <nav class="nav-links"><a href="index.html" class="nav-link">Home</a><a href="menu.html" class="nav-link">Menu</a></nav>
      <div class="nav-actions">
        <button class="icon-btn open-cart-btn"><i data-lucide="shopping-bag"></i><span class="icon-badge cart-count-badge" style="display:none;">0</span></button>
      </div>
    </div>
  </header>

  <main style="padding-top:7rem;" class="section">
    <div class="container">
      <div class="section-header">
        <span class="subtitle">Saved Brews</span>
        <h1 class="title-lg">Your Wishlist</h1>
      </div>

      <div id="wishlistGrid" class="grid grid-4"></div>
    </div>
  </main>

  <footer class="footer"><div class="container footer-bottom" style="border:none; padding:0;"><p>© 2026 Hamza Coffee Shop. All rights reserved.</p></div></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderWishlist();
    });

    function renderWishlist() {
      const grid = document.getElementById('wishlistGrid');
      if (!grid) return;

      const items = PRODUCTS_DATA.filter(p => AppState.wishlist.includes(p.id));

      if (items.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:4rem 1rem; background:var(--color-surface-card); border-radius:var(--radius-lg); border:1px solid var(--color-border-dark);">
            <i data-lucide="heart" style="font-size:3.5rem; opacity:0.3; margin-bottom:1rem; color:var(--color-caramel);"></i>
            <h3 style="margin-bottom:0.5rem;">Your wishlist is empty</h3>
            <p style="color:var(--color-text-dim); margin-bottom:1.5rem;">Save your favorite espresso drinks and treats by clicking the heart icon.</p>
            <a href="menu.html" class="btn btn-primary">Browse Menu</a>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = items.map(prod => `
        <div class="product-card">
          <div class="card-media">
            <img src="${prod.image}" alt="${prod.name}">
            <button class="wishlist-toggle active" onclick="AppState.toggleWishlist('${prod.id}'); renderWishlist();">
              <i data-lucide="heart" style="font-size:1rem;"></i>
            </button>
          </div>
          <div class="card-body">
            <h3 class="product-title" style="margin-bottom:0.25rem;">${prod.name}</h3>
            <p class="product-desc">${prod.description}</p>
            <div class="card-footer-flex">
              <span class="product-price">$${prod.price.toFixed(2)}</span>
              <button class="btn btn-primary btn-sm" onclick="AppState.addToCart(PRODUCTS_DATA.find(p=>p.id==='${prod.id}'))">+ Add</button>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }
  </script>
</body>
</html>
