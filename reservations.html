<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Table — Hamza Coffee Shop</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo"><div class="logo-icon"><i data-lucide="coffee"></i></div><span>Hamza</span> Coffee</a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="reservations.html" class="nav-link active">Book a Table</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn open-cart-btn"><i data-lucide="shopping-bag"></i><span class="icon-badge cart-count-badge" style="display:none;">0</span></button>
      </div>
    </div>
  </header>

  <main style="padding-top:7rem;" class="section">
    <div class="container" style="max-width:720px;">
      <div class="section-header reveal">
        <span class="subtitle">Table Reservations</span>
        <h1 class="title-lg">Reserve Your Café Experience</h1>
        <p>Book a cozy corner table or a group seating area for your business meeting or casual coffee date.</p>
      </div>

      <div style="background:var(--color-surface-card); padding:2.5rem; border-radius:var(--radius-lg); border:1px solid var(--color-border-dark); box-shadow:var(--shadow-lg);">
        <form id="reservationForm" onsubmit="handleReservationSubmit(event)">
          <div class="grid grid-2" style="gap:1.25rem;">
            <div>
              <label style="font-size:0.85rem; color:var(--color-text-dim); display:block; margin-bottom:0.4rem;">Full Name *</label>
              <input type="text" required id="resName" placeholder="e.g. Sophia Turner" style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);">
            </div>
            <div>
              <label style="font-size:0.85rem; color:var(--color-text-dim); display:block; margin-bottom:0.4rem;">Phone Number *</label>
              <input type="tel" required id="resPhone" placeholder="+1 (555) 345-6789" style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);">
            </div>
            <div style="grid-column:1/-1;">
              <label style="font-size:0.85rem; color:var(--color-text-dim); display:block; margin-bottom:0.4rem;">Email Address *</label>
              <input type="email" required id="resEmail" placeholder="sophia@example.com" style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);">
            </div>

            <div>
              <label style="font-size:0.85rem; color:var(--color-text-dim); display:block; margin-bottom:0.4rem;">Reservation Date *</label>
              <input type="date" required id="resDate" style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);">
            </div>
            <div>
              <label style="font-size:0.85rem; color:var(--color-text-dim); display:block; margin-bottom:0.4rem;">Time *</label>
              <select id="resTime" required style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);">
                <option value="09:00 AM">09:00 AM</option>
                <option value="11:30 AM">11:30 AM</option>
                <option value="02:00 PM">02:00 PM</option>
                <option value="04:30 PM">04:30 PM</option>
                <option value="07:00 PM">07:00 PM</option>
              </select>
            </div>

            <div style="grid-column:1/-1;">
              <label style="font-size:0.85rem; color:var(--color-text-dim); display:block; margin-bottom:0.4rem;">Number of Guests *</label>
              <select id="resGuests" style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);">
                <option value="2 Guests">2 Guests (Cozy Table)</option>
                <option value="4 Guests">4 Guests (Standard Table)</option>
                <option value="6 Guests">6 Guests (Lounge Seating)</option>
                <option value="8 Guests">8+ Guests (Group Meeting)</option>
              </select>
            </div>

            <div style="grid-column:1/-1;">
              <label style="font-size:0.85rem; color:var(--color-text-dim); display:block; margin-bottom:0.4rem;">Special Requests / Notes</label>
              <textarea id="resNotes" rows="3" placeholder="Window seat, quiet corner, wheelchair accessible..." style="width:100%; padding:0.75rem 1rem; border-radius:var(--radius-md); background:rgba(255,255,255,0.06); border:1px solid var(--color-border-dark); color:var(--color-cream);"></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg glow-pulse" style="width:100%; margin-top:1.5rem;">
            <i data-lucide="calendar"></i> Confirm Table Reservation
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Modal Confirmation -->
  <div id="resModal" class="cart-overlay" style="display:none; align-items:center; justify-content:center;">
    <div style="background:var(--color-surface-card); padding:2.5rem; border-radius:var(--radius-lg); border:1px solid var(--color-border-dark); max-width:480px; text-align:center;">
      <div style="width:64px; height:64px; border-radius:50%; background:rgba(76,175,80,0.15); color:#4CAF50; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem auto; font-size:2rem;">
        <i data-lucide="check-circle"></i>
      </div>
      <h2 style="font-family:var(--font-heading); margin-bottom:0.5rem;">Table Reserved!</h2>
      <p style="color:var(--color-text-dim); font-size:0.95rem; margin-bottom:1.5rem;" id="resModalBody"></p>
      <button class="btn btn-primary" onclick="closeResModal()">Done</button>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-bottom" style="border:none; padding:0;"><p>© 2026 Hamza Coffee Shop. All rights reserved.</p></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

    function handleReservationSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('resName').value;
      const date = document.getElementById('resDate').value;
      const time = document.getElementById('resTime').value;
      const guests = document.getElementById('resGuests').value;

      document.getElementById('resModalBody').textContent = `We look forward to hosting you, ${name}! Your table for ${guests} is confirmed on ${date} at ${time}.`;
      document.getElementById('resModal').style.display = 'flex';
      document.getElementById('resModal').classList.add('open');
    }

    function closeResModal() {
      document.getElementById('resModal').style.display = 'none';
      document.getElementById('resModal').classList.remove('open');
      document.getElementById('reservationForm').reset();
    }
  </script>
</body>
</html>
